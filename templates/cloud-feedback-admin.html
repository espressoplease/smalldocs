<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Feedback - SmallDocs</title>
<script src="/public/sdocs-theme-preference.js"></script>
<link rel="stylesheet" href="/public/css/fonts.css">
<link rel="stylesheet" href="/public/css/sidebar-shared.css">
<link rel="stylesheet" href="/public/css/site-sidebar.css">
<link rel="stylesheet" href="/public/css/info.css">
<link rel="stylesheet" href="/public/css/cloud-admin.css">
<link rel="stylesheet" href="/public/css/cloud-feedback.css">
</head>
<body class="sdocs-site-shell" data-legacy-library="false" data-sdocs-site-page="feedback" data-cloud-authenticated="true" data-cloud-terms-accepted="true">
<main class="main">
  <header class="page-head"><div><h1>Feedback</h1><p class="description">Private messages from signed-in users.</p></div><button class="btn" id="feedback-refresh" type="button">Refresh</button></header>
  <p id="feedback-inbox-status" class="description" role="status" aria-live="polite">Loading feedback...</p>
  <div id="feedback-messages" aria-label="Feedback messages"></div>
  <nav class="feedback-pagination" aria-label="Feedback pages"><button class="btn" id="feedback-previous" type="button" disabled>Previous</button><button class="btn" id="feedback-next" type="button" disabled>Next</button></nav>
</main>
<script src="/public/sdocs-sidebar-shared.js" defer></script>
<script src="/public/sdocs-scroll-header.js" defer></script>
<script src="/public/sdocs-site-sidebar.js" defer></script>
<script src="/public/sdocs-info-panel.js" defer></script>
<script src="/public/sdocs-info.js" defer></script>
<script src="/public/cloud-feedback-admin.js" defer></script>
</body>
</html>
