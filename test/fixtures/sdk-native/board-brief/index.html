<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Boardroom</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">ORBIT/BOARD</a>
    <div class="meeting-meta">
      <span>Growth committee</span>
      <span>August 2026</span>
    </div>
  </header>

  <main class="board-shell">
    <section class="briefing-header">
      <div>
        <p class="section-code">BRIEF 07</p>
        <h1 id="host-heading">Project Meridian</h1>
      </div>
      <button id="host-button" type="button">Request another analysis</button>
    </section>

    <table id="host-table" aria-label="Meeting details">
      <tbody>
        <tr><th scope="row">Decision</th><td>Approve pilot</td></tr>
        <tr><th scope="row">Owner</th><td>Growth team</td></tr>
        <tr><th scope="row">Review</th><td>Week eight</td></tr>
      </tbody>
    </table>

    <section class="briefing-frame" aria-label="Board briefing">
      <div id="briefing-report"></div>
    </section>
  </main>

  <footer>
    <span>Internal working document</span>
    <span>Generated by the strategy agent</span>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
