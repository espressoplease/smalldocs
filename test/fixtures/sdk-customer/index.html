<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independent SDK customer</title>
  <style>
    body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #f3f5f7; }
    .customer-shell { max-width: 920px; margin: 0 auto; }
    #customer-title { color: rgb(157, 23, 77); }
    #report { overflow: hidden; border: 1px solid #ccd2d8; border-radius: 10px; background: white; }
  </style>
</head>
<body>
  <main class="customer-shell">
    <h1 id="customer-title">Acme analysis workspace</h1>
    <div id="report"></div>
  </main>
  <script type="module">
    import { render } from '__SDOCS_ORIGIN__/sdk/0.1.1/smalldocs.js';

    const initialMarkdown = String.raw`# Agent research

This report was generated by an agent and rendered by SmallDocs.

## Evidence

| Signal | Result |
| --- | ---: |
| Interviews | 12 |
| Support requests | 28 |

## Working model

~~~cells
Item,Quantity,Unit cost,Total
Prototype,5,20,=B2*C2
Research,1,25,=B3*C3
Total,,,=SUM(D2:D3)
~~~

<button onclick="window.customerDocumentWasCompromised = true">Unsafe input</button>`;

    try {
      const view = await render('#report', initialMarkdown);
      window.sdkView = view;
      window.updateSdkDocument = async function () {
        await view.update('# Updated analysis\n\nThe host replaced the Markdown without rebuilding its page.');
        document.body.dataset.updated = 'true';
      };
      window.destroySdkDocument = function () {
        view.destroy();
        document.body.dataset.destroyed = 'true';
      };
      document.body.dataset.ready = 'true';
    } catch (error) {
      document.body.dataset.error = error.message;
    }
  </script>
</body>
</html>
