# Publishes the npm package with build provenance attestation.
#
# Triggered by pushing a `v*` tag. The tag's version must match
# cli/package.json's version, otherwise the workflow fails.
# (Root package.json belongs to the private server, not the CLI.)
#
# npm trusted publishing requires:
#   - permissions: id-token: write   (OIDC mint for GitHub Actions)
#   - Node 22.14+ and npm 11.5.1+
#   - --provenance --access public   (publish flags)
#   - "Trusted publisher" set up on npm package settings to allow
#     OIDC publishes from this repo + workflow file path.
#
# No NPM_TOKEN is needed: the package is configured to disallow
# token-based publishes, so the trusted-publisher OIDC flow is the
# only path that ships bytes.
#
# After a successful run the registry metadata gains
# `dist.attestations` (verifiable via `npm audit signatures` or
# `npm install <pkg>` warnings) cryptographically linking the
# published tarball to this Actions build of this commit.

name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Keep the CLI on npm 11 while ensuring trusted-publisher support.
      - name: Install an OIDC-capable npm release
        run: npm install -g npm@11

      - name: Verify trusted-publisher runtime
        run: |
          set -euo pipefail
          node --version
          npm --version
          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          node -e "const [major, minor, patch] = require('child_process').execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)"

      - name: Verify tag matches cli/package.json version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./cli/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match cli/package.json version $PKG"
            exit 1
          fi
          echo "Tag and cli/package.json agree on $TAG."

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish to npm with provenance
        working-directory: cli
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "Dry run: showing what would be published."
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
