<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallDocs Cloud</title>
<link rel="stylesheet" href="/public/css/cloud-sign-in.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="/"><span class="brand-full">SmallDocs</span><span class="brand-short">SDocs</span><span class="brand-tiny">SD</span></a>
    <span class="nav-sep">/</span>
    <span class="nav-label">Cloud</span>
  </header>
  <main class="auth-shell">
    <section class="auth-card cloud-account-card">
      <div class="auth-heading">
        <div class="auth-mark" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 15-5.5 5.5L9 18"/><path d="M5.516 16.07A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 3.501 7.327"/></svg>
        </div>
        <div>
          <h1>Your Cloud account</h1>
          <p>You are signed in. Documents you add to Cloud will appear in your Cloud library.</p>
        </div>
      </div>
      <div class="account-empty">
        <strong>Cloud account active</strong>
        <p>Open the Cloud library to search your documents, or open a local document and choose Add to Cloud from its file information.</p>
      </div>
      <div class="account-actions">
        <a href="/library?scope=cloud">Open Cloud library</a>
        <form method="post" action="/api/cloud/auth/logout"><button type="submit">Sign out</button></form>
      </div>
    </section>
  </main>
</body>
</html>
