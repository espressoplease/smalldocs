<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmallDocs developer documentation</title>
<meta name="description" content="Integrate the SmallDocs renderer into an application and display agent-authored documents.">
<link rel="canonical" href="https://smalldocs.org/developers">
<link rel="alternate" type="text/plain" href="/developers/llms.txt" title="Agent documentation index">
<link rel="stylesheet" href="/public/css/developers.css">
</head>
<body>
<header class="mobile-header">
  <a href="/developers">SmallDocs Developers</a>
  <button class="mobile-menu" type="button" aria-controls="developer-sidebar" aria-expanded="false">Menu</button>
</header>

<aside class="docs-sidebar" id="developer-sidebar">
    <div class="sidebar-brand">
      <a href="/" class="brand">SmallDocs</a>
      <a href="/developers" class="developer-label">Developers</a>
    </div>
    <nav aria-label="Developer documentation">
      <div class="nav-group">
        <a href="/developers" data-doc="sdk">Use the SDK</a>
        <a href="/developers/agents" data-doc="agents">Create SDoc Markdown with an agent</a>
      </div>
      <div class="nav-group">
        <p>Agent references</p>
        <div class="nav-children">
        <a href="/developers/authoring/markdown" data-doc="authoring/markdown">Markdown</a>
        <a href="/developers/authoring/code" data-doc="authoring/code">Code</a>
        <a href="/developers/authoring/math" data-doc="authoring/math">Math</a>
        <a href="/developers/authoring/diagrams" data-doc="authoring/diagrams">Diagrams</a>
        <a href="/developers/authoring/charts" data-doc="authoring/charts">Charts</a>
        <a href="/developers/authoring/cells" data-doc="authoring/cells">Computed cells</a>
        <a href="/developers/authoring/slides" data-doc="authoring/slides">Slides</a>
        <a class="nav-nested" href="/developers/authoring/slide-shapes" data-doc="authoring/slide-shapes">Custom shapes</a>
        <a href="/developers/authoring/video" data-doc="authoring/video">Video</a>
        <a href="/developers/authoring/styles" data-doc="authoring/styles">Styles</a>
        </div>
      </div>
    </nav>
    <div class="sidebar-status">
      <a href="/docs">Open SmallDocs</a>
      <a href="https://github.com/espressoplease/SDocs">GitHub</a>
      <span>SDK 0.1.1 experimental</span>
    </div>
</aside>

<main class="docs-main">
    <div id="developer-document" aria-live="polite" aria-busy="true">
      <p class="loading-message" role="status">Loading documentation</p>
      <div id="developer-renderer"></div>
    </div>
</main>

<script type="module" src="/public/developers.js"></script>
</body>
</html>
