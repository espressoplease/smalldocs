<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Join a SmallDocs library</title>
  <link rel="stylesheet" href="/public/css/cloud-sign-in.css">
</head>
<body>
  <header class="header"><a class="brand" href="/">SmallDocs</a><span class="nav-sep">/</span><span class="nav-label">Invitation</span></header>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="invite-title">
      <div class="auth-heading"><div class="auth-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13v8"/><path d="m8 17 4 4 4-4"/><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/></svg></div>
      <h1 id="invite-title">Join a library</h1>
      <p id="invite-copy">Accept the invitation using the email address it was sent to.</p></div>
      <div id="invite-profile-fields" class="profile-form" hidden>
        <div>
          <label for="invite-first-name">First name</label>
          <input class="text-input" id="invite-first-name" type="text" maxlength="128" autocomplete="given-name" placeholder="First name" required>
        </div>
        <div>
          <label for="invite-last-name">Last name</label>
          <input class="text-input" id="invite-last-name" type="text" maxlength="128" autocomplete="family-name" placeholder="Last name" required>
        </div>
      </div>
      <p class="auth-body" id="invite-profile-note" hidden>Shown to people you share documents with.</p>
      <button class="primary-button" id="accept-invite" type="button" disabled>Accept invitation</button>
      <p class="auth-status" id="invite-status" role="status" aria-live="polite"></p>
    <p class="auth-footer" id="invite-recovery" hidden><a id="invite-sign-in" href="/cloud/sign-in">Use another email</a> · <a href="/cloud/start">Open SmallDocs</a></p>
    </section>
  </main>
  <script src="/public/cloud-invite.js" defer></script>
</body>
</html>
