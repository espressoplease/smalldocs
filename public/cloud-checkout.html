<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subscribe to SmallDocs Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/css/cloud-invite.css">
</head>
<body>
  <main class="invite-shell checkout-shell">
    <a class="brand" href="/cloud">SmallDocs Cloud</a>
    <section class="invite-card checkout-card" aria-labelledby="checkout-title">
      <h1 id="checkout-title">Who is Cloud for?</h1>
      <p id="checkout-copy">Choose the account that matches how you want to share documents.</p>

      <div class="checkout-plans" id="checkout-plan-field">
        <button class="checkout-plan" id="checkout-personal" type="button" data-plan="personal">
          <span class="checkout-plan-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M5 21a7 7 0 0 1 14 0"></path></svg>
          </span>
          <span class="checkout-plan-copy"><strong>Just me</strong><span>Documents start private to you.</span></span>
          <span class="checkout-plan-price"><strong>£4</strong><span>per month</span></span>
        </button>
        <button class="checkout-plan" id="checkout-team" type="button" data-plan="team">
          <span class="checkout-plan-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span class="checkout-plan-copy"><strong>My team</strong><span>Invite people and control document access.</span></span>
          <span class="checkout-plan-price"><strong>£7</strong><span>per member / month</span></span>
        </button>
      </div>

      <button class="checkout-back" id="checkout-back" type="button" aria-label="Back to account choice" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span>Back</span>
      </button>

      <div class="checkout-detail" id="checkout-detail" hidden>
        <div class="checkout-selection">
          <div><span class="checkout-kicker">Selected</span><strong id="checkout-selection-name"></strong></div>
        </div>
        <p class="checkout-plan-note" id="checkout-plan-note"></p>
      </div>

      <div id="checkout-profile-field" hidden>
        <div class="checkout-profile-grid">
          <div>
            <label for="checkout-profile-first-name">First name</label>
            <input id="checkout-profile-first-name" type="text" maxlength="128" autocomplete="given-name" placeholder="First name" aria-describedby="checkout-profile-note">
          </div>
          <div>
            <label for="checkout-profile-last-name">Last name (optional)</label>
            <input id="checkout-profile-last-name" type="text" maxlength="128" autocomplete="family-name" placeholder="Last name" aria-describedby="checkout-profile-note">
          </div>
        </div>
        <p class="field-note" id="checkout-profile-note">Shown to people you share documents with.</p>
      </div>
      <div id="checkout-workspace-field" hidden>
        <label for="checkout-workspace">Account</label>
        <select id="checkout-workspace"></select>
      </div>
      <div id="checkout-team-field" hidden>
        <label for="checkout-team-name">Team name</label>
        <input id="checkout-team-name" type="text" maxlength="512" autocomplete="organization" placeholder="Your team" aria-describedby="checkout-team-note">
        <p class="field-note" id="checkout-team-note">Shown in your account switcher and to people you invite.</p>
      </div>
      <button id="checkout-button" type="button" disabled hidden>Continue to payment</button>
      <p class="status" id="checkout-status" role="status" aria-live="polite"></p>
      <p class="checkout-payment-note" id="checkout-payment-note" hidden>Stripe collects payment. The subscription renews monthly until cancelled.</p>
    </section>
  </main>
  <script src="/public/cloud-checkout.js" defer></script>
</body>
</html>
